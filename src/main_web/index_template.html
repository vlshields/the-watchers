<!doctype html>
<html lang="en-us">
<head>
	<meta charset="utf-8">
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">

	<title>Inversion</title>
	<meta name="title" content="Inversion">
	<meta name="description" content="An action platformer">
	<meta name="viewport" content="width=device-width">

	<style>
		body {
			margin: 0px;
			overflow: hidden;
			background-color: black;
		}
		canvas.game_canvas {
			border: 0px none;
			background-color: black;
			padding: 0;
			margin: 0;
			display: block;
		}
	</style>
</head>
<body>
	<canvas class="game_canvas" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1" onmousedown="event.target.focus()"></canvas>
	<script type="text/javascript" src="odin.js"></script>
	<script>
		var buildAssetVersion = "controls-labels-v2";
		var odinMemoryInterface = new odin.WasmMemoryInterface();
		odinMemoryInterface.setIntSize(4);
		var odinImports = odin.setupDefaultImports(odinMemoryInterface);

		var Module = {
			instantiateWasm: (imports, successCallback) => {
				const newImports = {
					...odinImports,
					...imports
				}

				return WebAssembly.instantiateStreaming(fetch("index.wasm?v=" + buildAssetVersion, {cache: "no-store"}), newImports).then(function(output) {
					var e = output.instance.exports;
					odinMemoryInterface.setExports(e);
					odinMemoryInterface.setMemory(e.memory);
					return successCallback(output.instance);
				});
			},
			onRuntimeInitialized: () => {
				var e = wasmExports;

				try {
					e._start();
					e.main_start();
				} catch (err) {
					console.error("[game] init error:", err);
					return;
				}

				function send_resize() {
					var canvas = document.getElementById('canvas');
					canvas.width = window.innerWidth;
					canvas.height = window.innerHeight;
					e.web_window_size_changed(canvas.width, canvas.height);
				}

				window.addEventListener('resize', function(event) {
					send_resize();
				}, true);

				send_resize();

				function do_main_update() {
					e.main_update();
					window.requestAnimationFrame(do_main_update);
				}

				window.requestAnimationFrame(do_main_update);
			},
			print: (function() {
				return function(text) {
					if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
					console.log(text);
				};
			})(),
			canvas: (function() {
				return document.getElementById("canvas");
			})()
		};
	</script>

	{{{ SCRIPT }}}
</body>
</html>
